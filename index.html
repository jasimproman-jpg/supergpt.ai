
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>SuperGPT AI</title>
<link rel="icon" type="image/png" href="logo.png">

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090b14;
  color: #f4f5ff;
  font-family: Arial, sans-serif;
}

button {
  border: 0;
  border-radius: 10px;
  background: #8d79ff;
  color: white;
  font-weight: bold;
  padding: 11px 15px;
  cursor: pointer;
}

button:disabled {
  opacity: .6;
  cursor: not-allowed;
}

/* MAIN LAYOUT */

.app {
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* SIDEBAR */

.sidebar {
  width: 270px;
  min-width: 270px;
  background: #101321;
  border-right: 1px solid #282b43;
  padding: 16px;
  display: flex;
  flex-direction: column;
}

.brand {
  color: #a99aff;
  font-size: 22px;
  font-weight: bold;
  margin-bottom: 22px;
}

.new-chat {
  width: 100%;
  text-align: left;
  background: #27213f;
  border: 1px solid #51427f;
  margin-bottom: 22px;
}

.sidebar-heading {
  color: #9298b5;
  font-size: 13px;
  margin-bottom: 12px;
}

#recent-chats {
  overflow-y: auto;
  flex: 1;
}

.chat-item {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  padding: 11px;
  margin-bottom: 5px;
  background: transparent;
  color: #c9cbe0;
  text-align: left;
  font-weight: normal;
  overflow: hidden;
}

.chat-item span {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.chat-item:hover,
.chat-item.active {
  background: #252941;
}

.sidebar-bottom {
  border-top: 1px solid #282b43;
  padding-top: 14px;
  font-size: 12px;
  color: #9298b5;
}

/* MAIN AREA */

.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

header {
  padding: 15px 20px;
  border-bottom: 1px solid #282b43;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

.header-title {
  font-size: 20px;
  font-weight: bold;
  color: #a99aff;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

#account-status {
  color: #a6aac3;
  font-size: 13px;
}

#google-signin {
  display: flex;
  justify-content: center;
}

#signout {
  display: none;
}

#theme {
  white-space: nowrap;
}

/* CHAT */

#chat {
  flex: 1;
  overflow-y: auto;
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}

.msg {
  padding: 13px 16px;
  border-radius: 15px;
  margin: 12px 0;
  max-width: 90%;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  line-height: 1.5;
}

.bot {
  background: #171b2c;
  border: 1px solid #292e49;
}

.user {
  background: #6550d9;
  margin-left: auto;
}

/* INPUT */

form {
  display: flex;
  gap: 8px;
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 12px 20px 20px;
}

input {
  flex: 1;
  min-width: 0;
  padding: 15px;
  border-radius: 12px;
  border: 1px solid #363a58;
  background: #121523;
  color: white;
  font-size: 16px;
}

footer {
  text-align: center;
  color: #8589a5;
  font-size: 12px;
  padding: 5px 10px 12px;
}

/* LIGHT THEME */

body.light {
  background: #f3f4fc;
  color: #17182a;
}

body.light .sidebar {
  background: #e8e9f5;
  border-color: #ddd;
}

body.light .sidebar-bottom,
body.light .sidebar-heading {
  color: #666;
}

body.light .chat-item {
  color: #303047;
}

body.light .chat-item:hover,
body.light .chat-item.active {
  background: #d7d8e9;
}

body.light header {
  border-color: #ddd;
}

body.light .bot {
  background: white;
  border-color: #ddd;
}

body.light input {
  background: white;
  color: #17182a;
  border-color: #ccc;
}

body.light footer {
  color: #666;
}

/* MOBILE */

@media (max-width: 650px) {
  .sidebar {
    width: 190px;
    min-width: 190px;
    padding: 10px;
  }

  header {
    padding: 12px;
    flex-wrap: wrap;
  }

  .header-right {
    flex-wrap: wrap;
  }

  #account-status {
    font-size: 11px;
  }

  .header-title {
    font-size: 17px;
  }

  #theme {
    font-size: 12px;
    padding: 9px;
  }

  #chat {
    padding: 12px;
  }

  form {
    padding: 8px;
  }
}

@media (max-width: 420px) {
  .sidebar {
    width: 145px;
    min-width: 145px;
    padding: 7px;
  }

  .brand {
    font-size: 17px;
  }

  .chat-item {
    padding: 8px 5px;
    font-size: 12px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <div class="brand">✦ SuperGPT</div>

    <button class="new-chat" id="new-chat">
      ＋ New Chat
    </button>

    <div class="sidebar-heading">
      RECENT CHATS
    </div>

    <div id="recent-chats"></div>

    <div class="sidebar-bottom">
      SuperGPT AI<br>
      Made by Jasim
    </div>

  </aside>

  <!-- MAIN CONTENT -->

  <main class="main">

    <header>

      <div class="header-title">
        ✦ SuperGPT AI
      </div>

      <div class="header-right">

        <div id="google-signin"></div>

        <span id="account-status">
          Not signed in
        </span>

        <button id="signout" type="button">
          Sign out
        </button>

        <button id="theme" type="button">
          ☀️ / 🌙
        </button>

      </div>

    </header>

    <section id="chat"></section>

    <form id="form">

      <input
        id="question"
        placeholder="Ask SuperGPT anything..."
        autocomplete="off"
        required
      >

      <button id="send" type="submit">
        Send ➤
      </button>

    </form>

    <footer>
      SuperGPT AI · Powered by AI · Made by Jasim
    </footer>

  </main>

</div>

<script>

/* =================================
   CONFIGURATION
================================= */

const WORKER_URL =
  "https://supergbt-backend.jasimproman.workers.dev";

const GOOGLE_CLIENT_ID =
  "47086029047-ebqem67q3a34b3nupns2noqqspvqh4b0.apps.googleusercontent.com";

const STORAGE_KEY = "supergpt_recent_chats";

/* =================================
   ELEMENTS
================================= */

const chat = document.getElementById("chat");
const input = document.getElementById("question");
const form = document.getElementById("form");
const send = document.getElementById("send");

const recentChats =
  document.getElementById("recent-chats");

const googleSignin =
  document.getElementById("google-signin");

const accountStatus =
  document.getElementById("account-status");

const signoutButton =
  document.getElementById("signout");

let googleCredential = null;
let signedInUser = null;

/* =================================
   CHAT STORAGE
================================= */

let conversations = [];

try {
  const saved = localStorage.getItem(STORAGE_KEY);
  conversations = saved ? JSON.parse(saved) : [];

  if (!Array.isArray(conversations)) {
    conversations = [];
  }
} catch (error) {
  conversations = [];
}

let currentChatId = null;

function saveChats() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(conversations)
    );
  } catch (error) {
    console.error("Could not save chats:", error);
  }
}

function getCurrentChat() {
  return conversations.find(
    item => item.id === currentChatId
  );
}

/* =================================
   CREATE NEW CHAT
================================= */

function createNewChat() {

  const newConversation = {
    id: Date.now().toString() +
        Math.random().toString(36).slice(2),

    title: "New Chat",

    messages: [
      {
        role: "assistant",
        content:
          "Hey! 👋 I'm SuperGPT AI. Ask me maths questions or anything else!"
      }
    ]
  };

  conversations.unshift(newConversation);

  currentChatId = newConversation.id;

  saveChats();
  renderChat();
  renderRecentChats();

  input.focus();
}

/* =================================
   RENDER MESSAGES
================================= */

function renderChat() {

  chat.innerHTML = "";

  const conversation = getCurrentChat();

  if (!conversation) return;

  conversation.messages.forEach(message => {

    const d = document.createElement("div");

    d.className =
      "msg " +
      (message.role === "user" ? "user" : "bot");

    d.textContent = message.content;

    chat.appendChild(d);

  });

  chat.scrollTop = chat.scrollHeight;
}

/* =================================
   ADD MESSAGE
================================= */

function addMessage(text, who) {

  const d = document.createElement("div");

  d.className = "msg " + who;
  d.textContent = text;

  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;

  return d;
}

/* =================================
   RECENT CHAT SIDEBAR
================================= */

function renderRecentChats() {

  recentChats.innerHTML = "";

  conversations.forEach(conversation => {

    const button = document.createElement("button");

    button.className = "chat-item";

    if (conversation.id === currentChatId) {
      button.classList.add("active");
    }

    const icon = document.createElement("span");
    icon.textContent = "💬";

    const title = document.createElement("span");
    title.textContent = conversation.title;

    button.appendChild(icon);
    button.appendChild(title);

    button.addEventListener("click", function() {

      currentChatId = conversation.id;

      renderChat();
      renderRecentChats();

    });

    recentChats.appendChild(button);

  });
}

/* =================================
   GOOGLE SIGN-IN
================================= */

async function handleGoogleSignIn(response) {

  try {

    accountStatus.textContent = "Checking account...";

    const result = await fetch(
      WORKER_URL + "/auth/google",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          credential: response.credential
        })
      }
    );

    const data = await result.json();

    if (!result.ok || !data.success) {
      throw new Error(
        data.error || "Sign-in failed."
      );
    }

    googleCredential = response.credential;
    signedInUser = data.user;

    accountStatus.textContent =
      "Hi, " +
      (signedInUser.name || "Google user");

    googleSignin.style.display = "none";
    signoutButton.style.display = "block";

  } catch (error) {

    googleCredential = null;
    signedInUser = null;

    accountStatus.textContent =
      "Sign-in failed. Try again.";

    console.error("Google sign-in error:", error);

  }
}

/* =================================
   INITIALIZE GOOGLE
================================= */

function initializeGoogleSignIn() {

  if (!window.google || !window.google.accounts) {
    accountStatus.textContent =
      "Google Sign-In could not load.";

    return;
  }

  google.accounts.id.initialize({

    client_id: GOOGLE_CLIENT_ID,

    callback: handleGoogleSignIn

  });

  google.accounts.id.renderButton(
    googleSignin,
    {
      theme: "filled_blue",
      size: "large",
      shape: "pill",
      text: "signin_with"
    }
  );
}

window.addEventListener("load", function() {

  let attempts = 0;

  const checkGoogle = setInterval(function() {

    attempts++;

    if (window.google && window.google.accounts) {

      clearInterval(checkGoogle);
      initializeGoogleSignIn();

    } else if (attempts >= 30) {

      clearInterval(checkGoogle);

      accountStatus.textContent =
        "Google Sign-In could not load.";

    }

  }, 300);

});

/* =================================
   SIGN OUT
================================= */

signoutButton.addEventListener("click", function() {

  googleCredential = null;
  signedInUser = null;

  accountStatus.textContent = "Not signed in";

  signoutButton.style.display = "none";
  googleSignin.style.display = "flex";

  if (window.google && window.google.accounts) {
    google.accounts.id.disableAutoSelect();
  }

});

/* =================================
   NEW CHAT BUTTON
================================= */

document.getElementById("new-chat")
  .addEventListener("click", createNewChat);

/* =================================
   AI CHAT
================================= */

form.addEventListener("submit", async function(e) {

  e.preventDefault();

  const question = input.value.trim();

  if (!question || send.disabled) return;

  if (!getCurrentChat()) {
    createNewChat();
  }

  const conversation = getCurrentChat();

  addMessage(question, "user");

  conversation.messages.push({
    role: "user",
    content: question
  });

  if (conversation.title === "New Chat") {

    conversation.title =
      question.length > 28
        ? question.slice(0, 28) + "..."
        : question;

  }

  saveChats();
  renderRecentChats();

  input.value = "";

  send.disabled = true;
  send.textContent = "Thinking...";

  const loading = addMessage(
    "SuperGPT is thinking...",
    "bot"
  );

  try {

    const requestBody = {
      messages: conversation.messages
        .filter(message =>
          message.role === "user" ||
          message.role === "assistant"
        )
    };

    if (googleCredential) {
      requestBody.idToken = googleCredential;
    }

    const response = await fetch(WORKER_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify(requestBody)

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error || "AI service problem."
      );
    }

    const reply =
      data.reply || "I couldn't make an answer.";

    loading.textContent = reply;

    conversation.messages.push({
      role: "assistant",
      content: reply
    });

    saveChats();

  } catch (error) {

    loading.textContent =
      "Sorry! I couldn't connect. Please try again.";

    console.error("Chat error:", error);

  } finally {

    send.disabled = false;
    send.textContent = "Send ➤";

    input.focus();

  }

});

/* =================================
   THEME SWITCHER
================================= */

document.getElementById("theme")
  .addEventListener("click", function() {

    document.body.classList.toggle("light");

  });

/* =================================
   STARTUP
================================= */

if (conversations.length > 0) {

  currentChatId = conversations[0].id;

  renderChat();
  renderRecentChats();

} else {

  createNewChat();

}

</script>

</body>
</html>
